<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generation with Stable Diffusion</title>
</head>
<body>

<h1>Generate Image with Stable Diffusion</h1>

<form method="POST">
    {% csrf_token %}
    <label for="prompt">Prompt:</label>
    <input type="text" id="prompt" name="prompt" required>
    <br><br>

    <label for="resolution">Resolution:</label>
    <input type="text" id="resolution" name="resolution" value="1024x1024" required>
    <br><br>

    <label for="guidance_scale">Guidance Scale:</label>
    <input type="number" id="guidance_scale" name="guidance_scale" value="7.5" step="0.1" required>
    <br><br>

    <label for="num_images">Number of Images:</label>
    <input type="number" id="num_images" name="num_images" value="4" min="1" required>
    <br><br>

    <label for="steps">Steps:</label>
    <input type="number" id="steps" name="steps" value="30" min="1" required>
    <br><br>

    <button type="submit">Generate Images</button>
</form>

{% if generative_image %}
    <h3>Generated Images:</h3>
    <div>
        {% for image in generative_image %}
            <img src="{{ image }}" alt="Generated Image" style="width: 300px; margin: 10px;">
        {% endfor %}
    </div>
{% endif %}

</body>
</html>
