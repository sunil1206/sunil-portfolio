{% load static %}

<button class="chatfab" onclick="toggleChat()">
  <img
    src="{% static 'img/chatbot.png' %}"
    alt="bot-avatar"
    class="chatavatar"
  />
</button>

<div id="chat-screen" class="chat-container hidden">
  <div class="chat-header">
    Chatbot
    <i class="fas fa-times close-chat" onclick="toggleChat()"></i>
  </div>
  <div class="chat-body">
    <div class="chat-message bot">
      <img
        src="{% static 'sunil.png' %}"
        alt="bot-avatar"
        class="avatar"
      />
      <span>Hi! How can I help you today?</span>
    </div>
  </div>
  <div class="chat-footer">
    <input type="text" placeholder="Type your message..." id="userInput" />
    <button id="sendBtn"><i class="fas fa-paper-plane"></i></button> </div>
</div>

<style>
  /* Floating Action Button (FAB) */
  .chatfab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px; /* Ensure it's a perfect circle */
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 50%;
    background-color: #AA60C8;
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
    z-index: 1000;
  }

  .chatfab:hover {
    background-color: #8e44ad; /* A slightly darker shade for hover */
  }

  .chatavatar {
    width: 50px;
    height: 55px;
  }

  /* Chat container styling */
  .chat-container {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    height: 450px;
    background-color: white;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1001;
    transition: all 0.3s ease-in-out; /* Smooth transition for opening/closing */
  }

  .hidden {
    display: none;
  }

  /* Chat header */
  .chat-header {
    background-color: #AA60C8;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: 500;
    font-size: 1.1rem;
    position: relative;
    flex-shrink: 0; /* Prevents header from shrinking */
  }

  /* Close button */
  .close-chat {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 1.2rem;
  }

  /* Chat body */
  .chat-body {
    padding: 10px;
    flex-grow: 1;
    overflow-y: auto;
    background-color: #f4f4f4;
  }

  .chat-body::-webkit-scrollbar {
    width: 5px;
  }

  .chat-body::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 10px;
  }

  /* Common chat message style */
  .chat-message {
    display: flex;
    align-items: flex-end; /* Align avatar to the bottom of the message */
    margin-bottom: 12px;
    max-width: 90%;
    word-wrap: break-word;
  }

  /* Bot message (aligned left) */
  .chat-message.bot {
    align-self: flex-start;
  }

  .chat-message.bot span {
    background-color: #ffffff;
    border-radius: 15px 15px 15px 0;
  }

  /* User message (aligned right) */
  .chat-message.user {
    align-self: flex-end;
    flex-direction: row-reverse; /* Flips the order of avatar and text */
  }

  .chat-message.user span {
    background-color: #AA60C8;
    color: white;
    border-radius: 15px 15px 0 15px;
  }

  /* Flex container for the chat body messages */
  .chat-body {
    display: flex;
    flex-direction: column;
  }

  /* Message bubble styling */
  .chat-message span {
    padding: 12px 15px;
    display: inline-block;
    box-shadow: 0 1px 1px rgba(0,0,0,0.05);
  }

  /* Avatar styles */
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin: 0 10px;
  }

  /* Chat footer (input and send button) */
  .chat-footer {
    display: flex;
    align-items: center;
    padding: 10px;
    border-top: 1px solid #ddd;
    background-color: #fff;
    flex-shrink: 0; /* Prevents footer from shrinking */
  }

  .chat-footer input {
    flex-grow: 1;
    border: 1px solid #ccc;
    padding: 10px 15px;
    border-radius: 20px;
    outline: none;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }

  .chat-footer input:focus {
    border-color: #AA60C8;
  }

  .chat-footer button {
    width: 40px;
    height: 40px;
    margin-left: 10px;
    background-color: #AA60C8;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.3s ease;
    font-size: 1rem;
  }

  .chat-footer button:hover {
    background-color: #8e44ad;
  }

  /* =================================== */
  /* ===== RESPONSIVE STYLES 📱 ===== */
  /* =================================== */
  @media (max-width: 600px) {
    .chat-container {
      width: 100%;
      height: 100%;
      bottom: 0;
      right: 0;
      border-radius: 0; /* Remove rounded corners for full-screen */
    }
  }

</style>

<script>
  // Select DOM elements
  const chatScreen = document.getElementById('chat-screen');
  const chatBody = document.querySelector('.chat-body');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // Function to toggle chat visibility
  function toggleChat() {
    chatScreen.classList.toggle('hidden');
  }

  // Event Listeners for send button and Enter key
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      event.preventDefault(); // Prevents new line on Enter
      sendMessage();
    }
  });

  // Main function to handle sending a message
  function sendMessage() {
    const messageText = userInput.value.trim();
    if (!messageText) return; // Don't send empty messages

    // Display the user's message immediately
    addMessage(messageText, 'user');
    userInput.value = ''; // Clear the input field

    // Get the bot's response from the backend
    getBotResponse(messageText);
  }

  // Function to get response from Django backend
  function getBotResponse(userMessage) {
    fetch('/chatbot/get_response/', { // Use the correct URL for your backend
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ message: userMessage })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        // Add a small delay for a more natural feel
        setTimeout(() => {
            addMessage(data.response, 'bot');
        }, 500);
      })
      .catch(error => {
        console.error('Error:', error);
        addMessage('Oops! Something went wrong on our end. Please try again.', 'bot');
      });
  }

  // Function to add a new message to the chat body
  function addMessage(message, type) {
    const messageElement = document.createElement('div');
    messageElement.classList.add('chat-message', type);

    const avatarSrc = type === 'bot'
        ? "{% static 'sunil.png' %}"
        : "{% static 'img/user_avatar.png' %}"; // Recommended: use a static asset for user avatar

    const messageHTML = `
      <img src="${avatarSrc}" alt="${type}-avatar" class="avatar" />
      <span>${message}</span>
    `;

    messageElement.innerHTML = messageHTML;
    chatBody.appendChild(messageElement);

    // Auto-scroll to the latest message
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  // Helper function to get the CSRF token from cookies
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
