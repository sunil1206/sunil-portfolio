{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
  </head>


    <!-- Floating Action Button with chatbot icon -->
    <button class="chatfab" onclick="toggleChat()">
<!--      <i class="fas fa-comments"></i>-->
      <img
            src="{% static 'img/chatbot.png' %}"
            alt="bot-avatar"
            class="chatavatar"
          />
    </button>

    <!-- Chat Screen -->
    <div id="chat-screen" class="chat-container hidden">
      <div class="chat-header">
        Chatbot
        <i class="fas fa-times close-chat" onclick="toggleChat()"></i>
      </div>
      <div class="chat-body">
        <div class="chat-message bot" style=" width: 280px">
        <img
            src="{% static 'sunil.png' %}"
            alt="bot-avatar"
            class="avatar"
          />
          <span>Hi! How can I help you today?</span>
        </div>
      </div>
      <div class="chat-footer">
        <input type="text" placeholder="Type your message..." id="userInput" />
        <button id="sendBtn">Send</button>
      </div>
    </div>

<!--    <script src="script.js"></script>-->

</html>


<style>

/* Floating Action Button (FAB) */
.chatfab {
    position: fixed;
  bottom: 20px;
  right: 20px;

  border: none;
<!--  background-color: #6200ea;-->
  width: 60px;
  cursor: pointer;
  transition: all 0.3s ease;

  border-radius: 50%;
    background-color: #AA60C8;
    color: white;
    font-size: 24px;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
  z-index: 1001; /* Ensure the button is above the chatbot popup */
}

.fab:hover {
    background-color: #3700b3;
}

.fab i {
    font-size: 24px;
}

/* Chat container styling */
.chat-container {
    position: fixed;
    bottom: 80px;
    right: 20px;
    max-width: 300px; /* It won't get wider than 300px */
    width: calc(100% - 40px); /* It will be 100% of the screen width minus 20px margin on each side */
    max-height: 450px; /* Set a max height */
    height: 70vh; /* It will take up 70% of the viewport's height */
    background-color: white;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.hidden {
    display: none;
}

/* Chat header */
.chat-header {
    background-color: #AA60C8;
    color: white;
    padding: 10px;
    text-align: center;
    font-weight: 500;
    position: relative;
}

/* Close button */
.close-chat {
    position: absolute;
    right: 10px;
    top: 10px;
    cursor: pointer;
}

/* Chat body */
.chat-body {
    padding: 10px;
    flex-grow: 1;
    overflow-y: auto; /* Allows scrolling for long messages */
    max-height: 350px; /* Adjusted to keep space for footer */
}

/* Hide the scrollbar */
.chat-body::-webkit-scrollbar {
    width: 0;
}

/* Common chat message style */
.chat-message {
    display: flex;
    align-items: center;
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 12px;
    max-width: 80%;
    word-wrap: break-word;
    position: relative;
}

/* Message bubble styling */
.chat-message span {
    display: inline-block;
    padding: 10px;
    border-radius: 12px;
}

/* Bot message (aligned left) */
.chat-message.bot {
    justify-content: flex-start;
}

.chat-message.bot span {
    background-color: #eee;
}

/* User message (aligned right) */
.chat-message.user {
    justify-content: flex-end;
}

.chat-message.user span {
    background-color: #AA60C8;
    color: white;
}

/* Avatar styles */
.avatar {
    width: 50px;
    height: 55px;
    border-radius: 50%;
}
.chatavatar{
    width: 50px;
    height: 55px;
}
/* Bot avatar (on the left side of message) */
.chat-message.bot .avatar {
    margin-right: 10px; /* Space between avatar and message */
}

/* User avatar (on the right side of message) */
.chat-message.user .avatar {
    margin-left: 5px; /* Reduced margin between avatar and chat window */
    order: 1; /* Avatar appears after the message */
}

/* Chat footer (input and send button) */
.chat-footer {
    display: flex;
    align-items: center;
    padding: 10px;
    border-top: 1px solid #ddd;
    background-color: #f9f9f9;
}

.chat-footer input {
    flex-grow: 1;
    border: none;
    padding: 12px;
    border-radius: 30px;
    background-color: #e0e0e0;
    outline: none;
    font-size: 14px;
    transition: background-color 0.3s ease;
}

.chat-footer input:focus {
    background-color: #d4d4d4;
}

.chat-footer button {
    padding: 10px 15px;
    margin-left: 10px;
    background-color: #AA60C8;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.3s ease;
}

.chat-footer button:hover {
    background-color: #3700b3;
}

.chat-footer button i {
    font-size: 18px;
}

</style>

<script>
  function getBotResponse(userInput) {
    fetch("/chatbot/get_response/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({ message: userInput })
    })
    .then(response => response.json())
    .then(data => addMessage(data.response, "bot"))
    .catch(error => console.error("Error:", error));
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

</script>

<script>
  // Function to toggle the chat screen's visibility
  function toggleChat() {
    const chatScreen = document.getElementById('chat-screen');
    chatScreen.classList.toggle('hidden');
  }

  // Event Listeners for send button and Enter key
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('userInput').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') sendMessage();
  });

  // Send message function
  function sendMessage() {
    const inputField = document.getElementById('userInput');
    const userInput = inputField.value.trim();
    if (!userInput) return;

    // Display user message
    addMessage(userInput, 'user');
    inputField.value = '';

    // Send to Django backend
    fetch('/chatbot/get_response/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ message: userInput })
    })
    .then(response => response.json())
    .then(data => {
      addMessage(data.response, 'bot');
    })
    .catch(error => {
      console.error('Error:', error);
      addMessage('Oops! Something went wrong.', 'bot');
    });
  }

  // Add message to chat
  function addMessage(message, type) {
    const chatBody = document.querySelector('.chat-body');
    const messageElement = document.createElement('div');
    messageElement.classList.add('chat-message', type);

    const avatar = document.createElement('img');
    avatar.classList.add('avatar');
    avatar.src = type === 'bot'
      ? '{% static 'sunil.png' %}'
      : 'https://www.w3schools.com/howto/img_avatar.png';

    const messageText = document.createElement('span');
    messageText.textContent = message;

    messageElement.appendChild(avatar);
    messageElement.appendChild(messageText);
    chatBody.appendChild(messageElement);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  // Get CSRF token helper
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>




<script>
  function getBotResponse(userInput) {
    fetch("/chatbot/chatbot/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({ message: userInput })
    })
    .then(response => response.json())
    .then(data => addMessage(data.response, "bot"))
    .catch(error => {
        console.error("Error:", error);
        addMessage("Sorry, something went wrong.", "bot");
    });
}

</script>
