<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #chatBox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; margin-bottom: 10px; }
        #chatBox div { margin-bottom: 10px; }
        .user { color: blue; }
        .bot { color: green; }
    </style>
</head>
<body>
    <h2>Portfolio Chatbot</h2>
    <div id="chatBox"></div>
    <input type="text" id="queryInput" placeholder="Ask me something..." />
    <button onclick="ask()">Send</button>

    <script>
        let sessionId = Math.random().toString(36).substring(2);
        function ask() {
            const query = document.getElementById("queryInput").value;
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML += `<div class='user'><strong>You:</strong> ${query}</div>`;
            fetch(`/chatbot_response/?query=${query}&session_id=${sessionId}`)
                .then(res => res.json())
                .then(data => {
                    chatBox.innerHTML += `<div class='bot'><strong>Bot:</strong> ${data.response}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
        }
    </script>
</body>
</html>
